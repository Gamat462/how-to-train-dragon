<script>
(function(){
  var KUNCI = "jalur-s2-luar-negeri-v1";
  function baca(){ try { return JSON.parse(localStorage.getItem(KUNCI) || "{}"); } catch(e){ return {}; } }
  function tulis(o){ try { localStorage.setItem(KUNCI, JSON.stringify(o)); } catch(e){} }

  var kotak = Array.prototype.slice.call(document.querySelectorAll('.cek input[type=checkbox]'));
  var tombolHari = Array.prototype.slice.call(document.querySelectorAll('.nav button[data-hari]'));
  var bagian = Array.prototype.slice.call(document.querySelectorAll('.day'));

  function perbaruiKemajuan(){
    var n = kotak.filter(function(k){ return k.checked; }).length;
    var t = kotak.length;
    var el = document.getElementById('teks-kemajuan');
    var bar = document.getElementById('isi-bar');
    if (el) el.textContent = n + " dari " + t + " langkah";
    if (bar) bar.style.width = (t ? (n/t*100) : 0) + "%";
    tombolHari.forEach(function(b){
      var h = b.getAttribute('data-hari');
      var sec = bagian.filter(function(s){ return s.getAttribute('data-hari') === h; })[0];
      if (!sec) return;
      var kk = Array.prototype.slice.call(sec.querySelectorAll('input[type=checkbox]'));
      var semua = kk.length > 0 && kk.every(function(k){ return k.checked; });
      b.classList.toggle('done', semua);
    });
  }

  var simpan = baca();
  kotak.forEach(function(k){
    if (simpan[k.id]) { k.checked = true; var l = k.closest('.langkah'); if (l) l.classList.add('selesai'); }
    k.addEventListener('change', function(){
      var s = baca();
      if (k.checked) { s[k.id] = 1; } else { delete s[k.id]; }
      tulis(s);
      var l = k.closest('.langkah');
      if (l) l.classList.toggle('selesai', k.checked);
      perbaruiKemajuan();
    });
  });

  tombolHari.forEach(function(b){
    b.addEventListener('click', function(){
      var h = b.getAttribute('data-hari');
      tombolHari.forEach(function(x){ x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
      bagian.forEach(function(s){ s.classList.toggle('aktif', s.getAttribute('data-hari') === h); });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      try { localStorage.setItem(KUNCI + "-hari", h); } catch(e){}
    });
  });

  try {
    var hariTersimpan = localStorage.getItem(KUNCI + "-hari");
    if (hariTersimpan) {
      var tb = tombolHari.filter(function(b){ return b.getAttribute('data-hari') === hariTersimpan; })[0];
      if (tb) {
        tombolHari.forEach(function(x){ x.setAttribute('aria-selected', x === tb ? 'true' : 'false'); });
        bagian.forEach(function(s){ s.classList.toggle('aktif', s.getAttribute('data-hari') === hariTersimpan); });
      }
    }
  } catch(e){}

  Array.prototype.slice.call(document.querySelectorAll('.salin')).forEach(function(b){
    b.addEventListener('click', function(){
      var pre = b.parentElement.querySelector('pre');
      if (!pre) return;
      var teks = pre.innerText;
      function sukses(){
        var lama = b.textContent;
        b.textContent = "Tersalin ✓";
        b.classList.add('ok');
        setTimeout(function(){ b.textContent = lama; b.classList.remove('ok'); }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(teks).then(sukses).catch(function(){ cadangan(teks, sukses); });
      } else { cadangan(teks, sukses); }
    });
  });

  function cadangan(teks, cb){
    var ta = document.createElement('textarea');
    ta.value = teks; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); cb(); } catch(e){}
    document.body.removeChild(ta);
  }

  var reset = document.getElementById('reset');
  if (reset) {
    reset.addEventListener('click', function(){
      kotak.forEach(function(k){ k.checked = false; var l = k.closest('.langkah'); if (l) l.classList.remove('selesai'); });
      tulis({});
      perbaruiKemajuan();
    });
  }

  perbaruiKemajuan();
})();
</script>
