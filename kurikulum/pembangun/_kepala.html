<title>Jalur S2 Luar Negeri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F3EFE4; --surface:#FDFBF5; --surface-2:#EAE2CC;
    --ink:#1C2430; --ink-soft:#5B6472; --line:#DCD3B9;
    --teal:#0F6E63; --teal-soft:#E1EEEA;
    --gold:#9C6B25; --gold-soft:#F1E4C8;
    --alert:#A33A2A; --alert-soft:#F6E2DD;
    --code-bg:#EFEAD9;
    --shadow: 0 24px 48px -28px rgba(28,36,48,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161D; --surface:#1A2029; --surface-2:#212939;
      --ink:#EDE9DD; --ink-soft:#98A2B3; --line:#303A4B;
      --teal:#5BCBB7; --teal-soft:rgba(91,203,183,0.14);
      --gold:#E0AE5F; --gold-soft:rgba(224,174,95,0.14);
      --alert:#E88A76; --alert-soft:rgba(232,138,118,0.14);
      --code-bg:#0F1319;
      --shadow: 0 24px 48px -28px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161D; --surface:#1A2029; --surface-2:#212939;
    --ink:#EDE9DD; --ink-soft:#98A2B3; --line:#303A4B;
    --teal:#5BCBB7; --teal-soft:rgba(91,203,183,0.14);
    --gold:#E0AE5F; --gold-soft:rgba(224,174,95,0.14);
    --alert:#E88A76; --alert-soft:rgba(232,138,118,0.14);
    --code-bg:#0F1319;
    --shadow: 0 24px 48px -28px rgba(0,0,0,0.6);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif; line-height:1.65;
    padding:16px 16px 80px;
  }
  h1,h2,h3,h4{ font-family:"Fraunces", Georgia, serif; text-wrap:balance; margin:0; color:var(--ink); }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  p{ margin:0; }
  a{ color:var(--teal); }
  code{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:0.87em;
        background:var(--code-bg); padding:2px 6px; border-radius:5px; }

  .nav{
    position:sticky; top:0; z-index:20; max-width:820px; margin:0 auto 20px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:8px; display:flex; gap:4px; flex-wrap:wrap;
    align-items:center;
  }
  .nav .lbl{ font-family:"Fraunces",serif; font-weight:600; font-size:0.9rem; padding:4px 8px; margin-right:auto; }
  .nav button{
    font-family:"IBM Plex Sans",sans-serif; font-size:0.82rem; font-weight:600;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft);
    padding:7px 13px; border-radius:999px; cursor:pointer;
  }
  .nav button:hover{ color:var(--ink); }
  .nav button[aria-selected="true"]{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .nav button:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .nav button.done::after{ content:" ✓"; }

  .kembali{ max-width:820px; margin:0 auto 14px; font-size:0.85rem; }
  .kembali a{ display:inline-flex; align-items:center; gap:5px; text-decoration:none; color:var(--ink-soft); }
  .kembali a:hover{ color:var(--teal); }

  .page{
    max-width:820px; margin:0 auto; background:var(--surface);
    border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
    padding:34px 38px 42px;
  }
  @media (max-width:600px){ .page{ padding:24px 18px 30px; } }

  header{ margin-bottom:26px; }
  .eyebrow{ font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--teal); display:block; margin-bottom:8px; }
  h1{ font-size:clamp(1.7rem,4.5vw,2.3rem); font-weight:600; }
  .lede{ margin-top:10px; color:var(--ink-soft); font-size:0.98rem; max-width:60ch; }

  .day{ display:none; }
  .day.aktif{ display:block; }
  .day-head{
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
    padding-bottom:12px; border-bottom:2px solid var(--line); margin-bottom:8px;
  }
  .day-head .n{ font-family:"IBM Plex Mono",monospace; font-size:0.72rem; letter-spacing:0.1em; color:var(--gold); }
  .day-head h2{ font-size:1.45rem; font-weight:600; }
  .day-head .waktu{ font-size:0.84rem; color:var(--ink-soft); margin-left:auto; }
  .tujuan{
    background:var(--teal-soft); border-radius:12px; padding:13px 17px;
    font-size:0.93rem; margin:16px 0 24px;
  }
  .tujuan strong{ color:var(--teal); }

  .langkah{
    border:1px solid var(--line); border-radius:14px; margin-bottom:18px;
    background:var(--surface-2); overflow:hidden;
  }
  .langkah-head{
    display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
    padding:14px 16px 10px;
  }
  .langkah-head .num{
    font-family:"IBM Plex Mono",monospace; font-size:0.78rem; font-weight:600;
    background:var(--teal); color:#fff; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .langkah-head h3{ font-size:1.02rem; font-weight:600; }
  .langkah-body{ padding:0 16px 16px; }
  .langkah-body > p{ font-size:0.93rem; margin-bottom:10px; }
  .langkah-body > p:last-child{ margin-bottom:0; }

  .cek{ display:flex; align-items:center; gap:7px; flex:none; }
  .cek input{ width:17px; height:17px; accent-color:var(--teal); cursor:pointer; }
  .cek label{ font-size:0.76rem; color:var(--ink-soft); cursor:pointer; user-select:none; }
  .langkah.selesai{ opacity:0.62; }
  .langkah.selesai .langkah-head .num{ background:var(--ink-soft); }

  .aksi{ border-left:3px solid var(--teal); background:var(--surface); border-radius:0 10px 10px 0;
         padding:12px 14px; margin:12px 0; }
  .aksi .tag{ font-family:"IBM Plex Mono",monospace; font-size:0.64rem; letter-spacing:0.09em;
              color:var(--teal); display:block; margin-bottom:7px; }
  .hasil{ border-left:3px solid var(--gold); background:var(--surface); border-radius:0 10px 10px 0;
          padding:12px 14px; margin:12px 0; }
  .hasil .tag{ font-family:"IBM Plex Mono",monospace; font-size:0.64rem; letter-spacing:0.09em;
               color:var(--gold); display:block; margin-bottom:7px; }

  .kode{ position:relative; margin:8px 0; }
  pre{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:0.79rem; line-height:1.55;
    background:var(--code-bg); border:1px solid var(--line); border-radius:10px;
    padding:13px 15px; overflow-x:auto; margin:0;
  }
  pre code{ background:none; padding:0; font-size:inherit; }
  .salin{
    position:absolute; top:7px; right:7px;
    font-family:"IBM Plex Sans",sans-serif; font-size:0.7rem; font-weight:600;
    background:var(--surface); color:var(--ink-soft);
    border:1px solid var(--line); border-radius:7px; padding:4px 10px; cursor:pointer;
  }
  .salin:hover{ color:var(--ink); border-color:var(--teal); }
  .salin:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .salin.ok{ color:var(--teal); border-color:var(--teal); }

  table{ width:100%; border-collapse:collapse; font-size:0.8rem; margin:8px 0; }
  .tabel-bungkus{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  th,td{ text-align:left; padding:6px 11px; border-bottom:1px solid var(--line); white-space:nowrap; }
  thead th{ background:var(--surface-2); font-family:"IBM Plex Mono",monospace;
            font-size:0.64rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft); }
  tbody tr:last-child td{ border-bottom:none; }
  td.n{ font-family:"IBM Plex Mono",monospace; text-align:right; font-variant-numeric:tabular-nums; }
  th.n{ text-align:right; }
  td.idx, th.idx{ color:var(--ink-soft); font-family:"IBM Plex Mono",monospace; }

  details{ margin-top:11px; }
  summary{
    cursor:pointer; font-size:0.85rem; font-weight:600; color:var(--gold);
    padding:7px 11px; background:var(--gold-soft); border-radius:9px; list-style:none;
  }
  summary::-webkit-details-marker{ display:none; }
  summary::before{ content:"▸ "; }
  details[open] summary::before{ content:"▾ "; }
  summary:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  details .isi{ padding:11px 13px; font-size:0.88rem; color:var(--ink-soft); }
  details .isi p{ margin-bottom:8px; }
  details .isi p:last-child{ margin-bottom:0; }

  .catatan{ background:var(--gold-soft); border-radius:11px; padding:12px 15px;
            font-size:0.89rem; margin:14px 0; }
  .catatan strong{ color:var(--gold); }
  .bahaya{ background:var(--alert-soft); border-radius:11px; padding:12px 15px;
           font-size:0.89rem; margin:14px 0; }
  .bahaya strong{ color:var(--alert); }

  .selesai-hari{
    border:2px dashed var(--teal); border-radius:14px; padding:18px 20px;
    margin-top:26px; background:var(--teal-soft);
  }
  .selesai-hari h3{ font-size:1.05rem; margin-bottom:8px; }
  .selesai-hari p{ font-size:0.91rem; }
  .selesai-hari ul{ margin:8px 0 0; padding-left:20px; font-size:0.91rem; }
  .selesai-hari li{ margin-bottom:5px; }

  .kemajuan{
    display:flex; align-items:center; gap:12px; margin:18px 0 4px;
    font-size:0.82rem; color:var(--ink-soft);
  }
  .bar{ flex:1; height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden;
        border:1px solid var(--line); }
  .bar span{ display:block; height:100%; width:0%; background:var(--teal); transition:width .25s ease; }

  .diagram{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:14px 0; font-size:0.85rem; }
  .diagram .kotak{
    border:1px solid var(--line); border-radius:10px; padding:10px 14px;
    background:var(--surface); flex:1 1 auto; min-width:110px; text-align:center;
  }
  .diagram .kotak strong{ display:block; font-family:"IBM Plex Mono",monospace; font-size:0.68rem; color:var(--teal); }
  .diagram .panah{ color:var(--ink-soft); font-size:1.1rem; flex:none; }

  footer{ border-top:1px solid var(--line); padding-top:20px; margin-top:32px;
          font-size:0.85rem; color:var(--ink-soft); }
  .tombol-reset{
    font-family:"IBM Plex Sans",sans-serif; font-size:0.76rem;
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    padding:5px 12px; border-radius:8px; cursor:pointer; margin-top:10px;
  }
  .tombol-reset:hover{ border-color:var(--alert); color:var(--alert); }
  .lanjut{
    display:block; text-align:center; margin-top:14px; text-decoration:none;
    background:var(--teal); color:#fff; font-family:"Fraunces",serif; font-weight:600;
    font-size:1rem; padding:14px 20px; border-radius:12px;
  }
  .lanjut:hover{ opacity:0.92; }
</style>
