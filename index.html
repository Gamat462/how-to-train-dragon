<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>⏱ Timer</h1>

    <div class="display" id="display">00:00:00</div>

    <div class="inputs" id="inputs">
      <label>
        <span>Jam</span>
        <input type="number" id="hours" min="0" max="23" value="0">
      </label>
      <label>
        <span>Menit</span>
        <input type="number" id="minutes" min="0" max="59" value="5">
      </label>
      <label>
        <span>Detik</span>
        <input type="number" id="seconds" min="0" max="59" value="0">
      </label>
    </div>

    <div class="presets">
      <button data-seconds="60">1 mnt</button>
      <button data-seconds="300">5 mnt</button>
      <button data-seconds="600">10 mnt</button>
      <button data-seconds="1800">30 mnt</button>
    </div>

    <div class="controls">
      <button id="startBtn" class="primary">Mulai</button>
      <button id="pauseBtn" disabled>Jeda</button>
      <button id="resetBtn">Reset</button>
    </div>

    <p class="status" id="status"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
